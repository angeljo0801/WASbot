name: Build WhatsBot APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          flutter create . --platforms=android --org com.whatsbot --project-name whatsbot
          rm -f test/widget_test.dart

      - name: Configure Android for local llama.cpp
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          p.write_text(s)
          PY

      - name: Add WhatsBot launcher icon
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/values/whatsbot_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="whatsbot_blue">#2563EB</color>
          </resources>
          EOF
          cat > android/app/src/main/res/drawable/ic_whatsbot_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M54,13 C31,13 14,29 14,50 C14,61 18,71 27,79 L23,95 L40,87 C45,89 49,90 54,90 C77,90 94,73 94,50 C94,29 77,13 54,13 Z"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="4.5"
                  android:strokeLineJoin="round"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:fillType="evenOdd"
                  android:pathData="M36,27 L53,27 C66,27 73,33 73,42 C73,49 69,53 63,55 C72,57 77,63 77,71 C77,82 68,88 53,88 L36,88 Z M47,37 L47,51 L52,51 C59,51 62,48 62,44 C62,39 59,37 52,37 Z M47,61 L47,78 L53,78 C61,78 66,75 66,69 C66,64 61,61 53,61 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/whatsbot_blue"/>
              <foreground android:drawable="@drawable/ic_whatsbot_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python - <<'PY'
          from pathlib import Path
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = s.replace('android:label="whatsbot"', 'android:label="WhatsBot"')
          m.write_text(s)
          PY

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: WhatsBot-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

name: Build WhatsBot APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/WhatsBotBackupStorageBridge.kt'
      - '.github/WhatsBotLocalAiManagerBridge.kt'
      - '.github/WhatsBotMainActivity.kt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
      WHATSBOT_APPLICATION_ID: com.whatsbot.whatsbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          flutter create . --platforms=android --org com.whatsbot --project-name whatsbot
          rm -f test/widget_test.dart

      - name: Configure stable Android identity, backup bridge and signing
        working-directory: mobile
        env:
          WHATSBOT_KEYSTORE_B64: ${{ secrets.WHATSBOT_KEYSTORE_B64 }}
          WHATSBOT_KEYSTORE_PASSWORD: ${{ secrets.WHATSBOT_KEYSTORE_PASSWORD }}
          WHATSBOT_KEY_ALIAS: ${{ secrets.WHATSBOT_KEY_ALIAS }}
          WHATSBOT_KEY_PASSWORD: ${{ secrets.WHATSBOT_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/whatsbot/whatsbot
          cp ../.github/WhatsBotBackupStorageBridge.kt android/app/src/main/kotlin/com/whatsbot/whatsbot/WhatsBotBackupStorageBridge.kt
          cp ../.github/WhatsBotLocalAiManagerBridge.kt android/app/src/main/kotlin/com/whatsbot/whatsbot/LocalAiManagerBridge.kt
          cp ../.github/WhatsBotMainActivity.kt android/app/src/main/kotlin/com/whatsbot/whatsbot/MainActivity.kt

          normalize_secret() {
            local name="$1"
            local raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }

          export WHATSBOT_KEYSTORE_B64="$(normalize_secret WHATSBOT_KEYSTORE_B64 "$WHATSBOT_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')"
          export WHATSBOT_KEYSTORE_PASSWORD="$(normalize_secret WHATSBOT_KEYSTORE_PASSWORD "$WHATSBOT_KEYSTORE_PASSWORD")"
          export WHATSBOT_KEY_ALIAS="$(normalize_secret WHATSBOT_KEY_ALIAS "$WHATSBOT_KEY_ALIAS")"
          export WHATSBOT_KEY_PASSWORD="$(normalize_secret WHATSBOT_KEY_PASSWORD "$WHATSBOT_KEY_PASSWORD")"

          printf '%s' "$WHATSBOT_KEYSTORE_B64" | base64 --decode > android/app/whatsbot-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 35')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "28.2.13676358"')
          s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.whatsbot.whatsbot"', s, count=1)
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.whatsbot.whatsbot"', s, count=1)

          alias = os.environ['WHATSBOT_KEY_ALIAS'].strip()
          store_password = os.environ['WHATSBOT_KEYSTORE_PASSWORD'].strip()
          key_password = os.environ['WHATSBOT_KEY_PASSWORD'].strip()

          def esc(value):
              return value.replace('\\', '\\\\').replace('"', '\\"')

          signing = '''    signingConfigs {
              create("whatsBotRelease") {
                  keyAlias = "''' + esc(alias) + '''"
                  keyPassword = "''' + esc(key_password) + '''"
                  storeFile = file("whatsbot-release.jks")
                  storePassword = "''' + esc(store_password) + '''"
              }
          }

          '''
          if 'create("whatsBotRelease")' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("whatsBotRelease")'
          )
          if 'isMinifyEnabled = false' not in s:
              s, n = re.subn(
                  r'(release\s*\{)',
                  r'\1\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('Could not patch release minify settings')
          p.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          x = manifest.read_text()
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.INTERNET' not in x:
              x = x.replace(
                  root,
                  root + '\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1,
              )
          if 'android.permission.WRITE_EXTERNAL_STORAGE' not in x:
              x = x.replace(
                  root,
                  root + '\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
                  1,
              )
          if 'android.permission.READ_EXTERNAL_STORAGE' not in x:
              x = x.replace(
                  root,
                  root + '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
                  1,
              )
          if 'com.angelapps.local_ai_manager' not in x:
              x = x.replace(
                  root,
                  root + '\n    <queries>\n        <package android:name="com.angelapps.local_ai_manager" />\n    </queries>',
                  1,
              )
          manifest.write_text(x)
          PY

      - name: Add WhatsBot launcher icon
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/values/whatsbot_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="whatsbot_blue">#2563EB</color>
          </resources>
          EOF
          cat > android/app/src/main/res/drawable/ic_whatsbot_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M54,13 C31,13 14,29 14,50 C14,61 18,71 27,79 L23,95 L40,87 C45,89 49,90 54,90 C77,90 94,73 94,50 C94,29 77,13 54,13 Z"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="4.5"
                  android:strokeLineJoin="round"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:fillType="evenOdd"
                  android:pathData="M36,27 L53,27 C66,27 73,33 73,42 C73,49 69,53 63,55 C72,57 77,63 77,71 C77,82 68,88 53,88 L36,88 Z M47,37 L47,51 L52,51 C59,51 62,48 62,44 C62,39 59,37 52,37 Z M47,61 L47,78 L53,78 C61,78 66,75 66,69 C66,64 61,61 53,61 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/whatsbot_blue"/>
              <foreground android:drawable="@drawable/ic_whatsbot_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = s.replace('android:label="whatsbot"', 'android:label="WhatsBot"')
          m.write_text(s)
          PY

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify persistent signing secrets
        env:
          WHATSBOT_KEYSTORE_B64: ${{ secrets.WHATSBOT_KEYSTORE_B64 }}
          WHATSBOT_KEYSTORE_PASSWORD: ${{ secrets.WHATSBOT_KEYSTORE_PASSWORD }}
          WHATSBOT_KEY_ALIAS: ${{ secrets.WHATSBOT_KEY_ALIAS }}
          WHATSBOT_KEY_PASSWORD: ${{ secrets.WHATSBOT_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in WHATSBOT_KEYSTORE_B64 WHATSBOT_KEYSTORE_PASSWORD WHATSBOT_KEY_ALIAS WHATSBOT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::WhatsBot will not publish an APK with temporary signing."
            exit 1
          fi

      - name: Build stable release APK
        working-directory: mobile
        run: |
          flutter build apk --release --target-platform android-arm64 --build-name 0.9.0 --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK signature
        working-directory: mobile
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          {
            echo "applicationId=com.whatsbot.whatsbot"
            echo "versionName=0.9.0"
            echo "buildNumber=$GITHUB_RUN_NUMBER"
            echo "signing=persistent"
            echo "backups=Downloads/WhatsBot"
          } > build/app/outputs/flutter-apk/BUILD_IDENTITY.txt
          rm -f android/app/whatsbot-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: WhatsBot-v0.9.0-Knowledge-Inbox-APK
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/BUILD_IDENTITY.txt

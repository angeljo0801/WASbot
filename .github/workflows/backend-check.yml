name: Check WhatsBot Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend Python
        run: python -m py_compile backend/app.py backend/main.py backend/combo.py backend/remittances.py backend/assistant_features.py backend/test_remittances.py
      - name: Test remittance rules
        run: python backend/test_remittances.py

name: Check WhatsBot Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend Python
        run: python -m py_compile backend/app.py backend/main.py backend/combo.py backend/remittances.py backend/assistant_features.py backend/test_remittances.py backend/gmail_reconstruction.py backend/test_gmail_reconstruction.py backend/test_gmail_related_photos.py backend/test_gmail_delivery_proof.py backend/gmail_oauth.py backend/test_gmail_diagnostics.py
      - name: Test remittance rules
        run: python backend/test_remittances.py
      - name: Test Gmail tracking fallback and false-positive guards
        run: python backend/test_gmail_reconstruction.py
      - name: Test same-thread and verified-order Gmail photo discovery
        run: python backend/test_gmail_related_photos.py
      - name: Test courier delivery proof is not a product image
        run: python backend/test_gmail_delivery_proof.py
      - name: Test Gmail live-permission diagnostics without real accounts
        run: python backend/test_gmail_diagnostics.py

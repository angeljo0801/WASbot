name: whatsbot
version: 0.8.3+12
publish_to: 'none'
description: Inbox personal de notas recibidas desde WhatsApp con IA local opcional.
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  llama_flutter_android: ^0.2.6
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  sqflite: ^2.4.2+1
  google_mlkit_text_recognition: ^0.17.1
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  path: ^1.9.1
  betto_inferencing: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
